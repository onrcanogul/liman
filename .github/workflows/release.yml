# A tag v1.2.3 publishes a release: the binaries for Linux (limand installs
# itself), install.sh, their checksums and a provenance attestation, after
# every check in ci.yml has passed. Run by hand, it builds and checks the
# files without publishing anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs the history and the tags.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make release
      - name: The binaries say the version
        if: github.ref_type == 'tag'
        run: |
          for f in dist/limand-linux-amd64 dist/liman-linux-amd64; do
            "$f" version | head -1 | tee /dev/stderr | grep -q " ${GITHUB_REF_NAME} " ||
              { echo "::error::$f does not say ${GITHUB_REF_NAME}"; exit 1; }
          done
      - name: Files and checksums
        run: |
          cp deploy/install.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # the release
      id-token: write      # the attestation's signature
      attestations: write  # storing the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
