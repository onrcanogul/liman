# A tag v1.2.3 makes a draft release: limand and liman for Linux (limand
# installs itself), liman for macOS, install.sh, their checksums and a
# provenance attestation, after every check in ci.yml has passed, with
# the notes in docs/releases/v1.2.3.md. v0.x and tags with a hyphen
# (v1.0.0-rc.1) are pre-releases. A person looks at the draft and publishes it:
#   gh release edit v1.2.3 --draft=false
# Run by hand, it builds and checks the files without making a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs the history and the tags.
          fetch-depth: 0
      - name: The release has notes
        if: github.ref_type == 'tag'
        run: |
          test -s "docs/releases/${GITHUB_REF_NAME}.md" ||
            { echo "::error::docs/releases/${GITHUB_REF_NAME}.md is missing: write the release notes first"; exit 1; }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make release
      # The macOS ones cannot run here, but their build information says
      # what they were built for.
      - name: Every binary is there, built for what its name says
        run: |
          for f in limand-linux-amd64 limand-linux-arm64 liman-linux-amd64 liman-linux-arm64 \
                   liman-darwin-amd64 liman-darwin-arm64; do
            got=$(go version -m "dist/$f" | awk '
              $2 ~ /^GOOS=/   { os = substr($2, 6) }
              $2 ~ /^GOARCH=/ { arch = substr($2, 8) }
              END { print os "-" arch }')
            test "$got" = "${f#*-}" ||
              { echo "::error::dist/$f is built for '$got'"; exit 1; }
            echo "dist/$f: $got"
          done
      # One make run gives every binary the same version.
      - name: The binaries say the version
        if: github.ref_type == 'tag'
        run: |
          for f in dist/limand-linux-amd64 dist/liman-linux-amd64; do
            "$f" version | head -1 | tee /dev/stderr | grep -q " ${GITHUB_REF_NAME} " ||
              { echo "::error::$f does not say ${GITHUB_REF_NAME}"; exit 1; }
          done
      - name: Files and checksums
        run: |
          cp deploy/install.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # the release
      id-token: write      # the attestation's signature
      attestations: write  # storing the attestation
    steps:
      # Only the notes; the files come from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft "${pre[@]}" --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" dist/*
