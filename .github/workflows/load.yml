# The load test, by hand only: on shared machines its numbers differ from
# run to run, so it informs rather than decides.
name: load

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long each scenario runs
        default: '10'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make load-test
        env:
          LIMAN_LOAD_SECONDS: ${{ inputs.seconds }}
